<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         height: 100vh; margin: 0; }
  h1 { font-size: 3rem; margin-bottom: .5rem; }
  p { color: #94a3b8; }
  .card { background: #1e293b; padding: 2rem 3rem; border-radius: 1rem; text-align: center; }
  input, button { font-size: 1rem; padding: .5rem .8rem; border-radius: .5rem; border: none; }
  input { margin-right: .5rem; }
  button { background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; }
  #result { margin-top: 1rem; font-size: 1.4rem; color: #4ade80; min-height: 2rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello World</h1>
    <p>呢個 page 係由 Spring Boot 直接 serve 出嚟嘅靜態檔案</p>
    <p>下面個掣會用 JavaScript call 後端嘅 REST API：</p>
    <div>
      <input id="nameInput" placeholder="輸入你個名" value="tom">
      <button onclick="sayHello()">打招呼</button>
    </div>
    <div id="result"></div>
  </div>
<script>
  // JavaScript 用 fetch 去 call Java 後端嘅 /api/hello
  async function sayHello() {
    const name = document.getElementById('nameInput').value || 'World';
    const res = await fetch('/api/hello?name=' + encodeURIComponent(name));
    const data = await res.json();
    document.getElementById('result').textContent = data.message;
  }
  sayHello(); // 入 page 即 call 一次
</script>
</body>
</html>
